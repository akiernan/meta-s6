BB_CONF_FRAGMENT_SUMMARY = "Run the oeqa runtime tests against images with testimage."
BB_CONF_FRAGMENT_DESCRIPTION = "Adds testimage to IMAGE_CLASSES and relaxes the login prompt \
match so that it copes with s6 starting getty while the kernel is still writing to the console. \
"

IMAGE_CLASSES += "testimage"

# s6-rc starts getty as soon as /dev/pts is mounted, while the kernel is often
# still draining its boot messages to the serial console, so the banner can
# come out as "qemuarm64[ ...kernel line... ]\nlogin:". qemurunner waits for
# " login:" with a leading space and never sees it; without the space it does.
TESTIMAGE_BOOT_PATTERNS = "search_reached_prompt"
TESTIMAGE_BOOT_PATTERNS[search_reached_prompt] = "login:"
