# /etc/s6.conf - configuration for the s6 command (s6-frontend)
#
# This file follows envfile syntax: key = value lines, # comments.
# Unset (or empty) values use the compiled-in defaults, shown below.

# Directory where s6-svscan is running
# scandir = /run/service

# s6-rc live service database
# livedir = /run/s6-rc

# Repository of service sets managed by the s6 repository commands
# repodir = /var/lib/s6-rc/repository

# Boot-time compiled service database (must always be a symlink)
# bootdb = /etc/s6-rc/compiled/current

# Root-only runtime data and temporary files for s6-frontend
# stmpdir = /run/s6-frontend

# Colon-separated list of service definition stores
# storelist = /usr/share/s6/sources:/etc/s6/sources

# Default verbosity: 0 terse, 1 normal, 2 and up increasingly verbose
# verbosity = 1

# User for the fd-holding daemon spawned by s6-rc; root is fine, but
# it may be set to an unprivileged user
# fdhuser = root
