[mount-sys-kernel-config]
type = "oneshot"
dependencies = [
    "mount-sys",
]
down = "s6-umount /sys/kernel/config"
up = """
if { modprobe -abq configfs }
if { eltest -d /sys/kernel/config }
s6-mount -t configfs -o nosuid,nodev,noexec configfs /sys/kernel/config
"""
