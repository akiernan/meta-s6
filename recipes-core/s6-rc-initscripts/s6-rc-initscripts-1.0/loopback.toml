# Nothing else brings lo up. oe-core does it from init-ifupdown, whose
# networking script is a runlevel script (start 01 2 3 4 5), and the s6-rc
# backend never runs those; connmand would do it, but only on an image which
# has connman. Without this, lo stays at flags 0x8 - IFF_LOOPBACK without
# IFF_UP - and anything reaching for 127.0.0.1 gets ENETUNREACH.
#
# ip comes from busybox or iproute2; every practical image has one of them.
[loopback]
flag-essential = true
dependencies = [
    "00",
]
type = "oneshot"
up = """
ip link set lo up
"""
down = """
# leave lo up: taking it down breaks anything still shutting down that
# talks to itself, and the interface goes away with the kernel anyway
"""
