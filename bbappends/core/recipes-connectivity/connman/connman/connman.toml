# No logger, deliberately: connmand's openlog() is unconditional, so it always
# logs to syslog and its output lands in syslogd's pipeline. --nodaemon alone
# would add LOG_PERROR and copy every message to stderr as well, which is what
# the --noperror patch exists to stop, so a pipeline of its own could only ever
# duplicate what syslogd already has. fdmove still catches what does not go
# through syslog - glib warnings, the backtrace handler - for the catch-all.
[connman-srv]
flag-recommended = true
type = "longrun"
dependencies = [
    "dbus-srv",
    "udev-trigger",
    "wpa-supplicant-srv",
]
run = """\
#!/usr/bin/execlineb -P

fdmove -c 2 1
connmand --nodaemon --noperror
"""
