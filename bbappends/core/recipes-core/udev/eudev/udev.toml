[udev-srv]
flag-recommended = true
dependencies = [
    "mount-proc",
    "mount-sys",
]
run = """
#!/usr/bin/execlineb -P

exec -c
udevd
"""
type = "longrun"

[udev-settle]
dependencies = [
    "udev-srv",
    "udev-trigger",
]
type = "oneshot"
up = "udevadm settle"

# Depends on sysctl because this is what brings network interfaces into
# existence, and net.*.conf.default.* only reaches interfaces created after it
# is applied. Run the other way round and those settings take on nothing, with
# no error to say so.
[udev-trigger]
flag-recommended = true
dependencies = [
    "sysctl",
    "udev-srv",
]
type = "oneshot"
up = """
if { udevadm trigger --action=add --type=subsystems }
udevadm trigger --action=add --type=devices
"""

[init-static-devnodes]
dependencies = [
    "mount-proc",
]
type = "oneshot"
up = """
foreground
{
  pipeline { kmod static-nodes --format=devname }
  pipeline { s6-cut -f1 -d\" \" }
  forstdin -pd \"\\n\" -- mod
  importas -iu mod mod
  modprobe -q ${mod}
}
exit 0
"""

[init-dev]
contents = [
    "udev-srv",
]
