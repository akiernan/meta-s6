# Deliberately unflagged. A boot splash is a choice - it wants a framebuffer,
# it hides the console, and plenty of images want neither - so it is compiled
# into the database and starts only when asked for, by name or as a
# dependency of something that wants it.
#
# A oneshot rather than a longrun, because psplash is meant to exit: it quits
# once anything else draws on the framebuffer, and a supervisor would read
# that as a crash and start it again, and again.
#
# The fifo is left where psplash puts it. Its built-in default is /run, which
# is a tmpfs before any of this runs, and it creates the fifo itself. That is
# what oe-core's systemd units expect - they set no PSPLASH_FIFO_DIR and test
# for /run/psplash_fifo - whereas the sysv path moves it to /mnt and has to
# mount a tmpfs there to do it. Staying with the default means psplash-write
# needs nothing in its environment either, which matters here because there is
# no rc to export a variable for the whole boot.
#
# /dev/fb0 is tested rather than waited for. A framebuffer that arrives with a
# module rather than built in may not be there yet, in which case depend on
# udev-settle as well - oe-core's systemd path is started from a udev rule on
# the graphics subsystem for the same reason.
[psplash]
dependencies = [
    "mount-proc",
]
type = "oneshot"
up = """
if -t { eltest -e /dev/fb0 }
if -n -t { redirfd -r 0 /proc/cmdline s6-grep -q -F psplash=false }
backtick -E -n -D 0 rotation
{
  if -t { eltest -r /etc/rotation }
  redirfd -r 0 /etc/rotation
  s6-cat
}
background { psplash --angle $rotation }
exit 0
"""
down = """
# it quits by itself as soon as anything else draws, so it may be long gone
foreground { psplash-write QUIT }
exit 0
"""
